[project]
name = "gulf-idp"
version = "0.1.0"
description = "Arabic-first document intelligence (Gulf edition) built on Microsoft's content-processing-solution-accelerator"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pymupdf>=1.24,<2",
  "hijridate>=2.5",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "pillow>=10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
